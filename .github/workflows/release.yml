name: Build & Release APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

# 每次 push 都要发布，不能取消进行中的任务；按顺序排队
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
        shell: bash

      # v6 moves caching into a proprietary component; v5 is Node 24 and still MIT.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore proot runtime
        uses: actions/cache@v6
        with:
          path: |
            .cache/proot
            app/src/main/jniLibs
          key: proot-${{ runner.os }}-${{ hashFiles('tools/fetch-proot.py') }}

      - name: Fetch proot runtime
        run: python3 tools/fetch-proot.py --all

      - name: Check release notes script
        run: bash -n .github/scripts/release-notes.sh

      - name: Resolve version
        id: version
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          # versionCode 必须单调递增；基线 5 之后从 1000 起，避开本地调试版本
          version_code="$((1000 + GITHUB_RUN_NUMBER))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名密钥，将使用 debug key 签名（可侧载安装，不适合分发）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/claudroid-release.keystore"
          echo "CLAUDROID_KEYSTORE=$RUNNER_TEMP/claudroid-release.keystore" >> "$GITHUB_ENV"
          echo "CLAUDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CLAUDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CLAUDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble release APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"

      - name: Rename & checksum
        run: |
          version="${{ steps.version.outputs.version }}"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" "dist/claudroid-${version}.apk"
          (cd dist && sha256sum "claudroid-${version}.apk" > "claudroid-${version}.apk.sha256")
          ls -lh dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: claudroid-release
          path: dist/*
          retention-days: 7

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: claudroid-release
          path: release

      - name: Generate release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          bash .github/scripts/release-notes.sh \
            "v${{ needs.build.outputs.version }}" release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          apk="$(find release -maxdepth 1 -name '*.apk' -print -quit)"
          sha="$(find release -maxdepth 1 -name '*.sha256' -print -quit)"
          if [ -z "$apk" ] || [ -z "$sha" ]; then
            echo "缺少构建包或校验文件，发布中止"
            ls -l release
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --latest
            gh release upload "$TAG" "$apk" "$sha" --clobber
          else
            gh release create "$TAG" "$apk" "$sha" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
