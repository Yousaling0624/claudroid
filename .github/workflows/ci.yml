name: CI

on:
  # push main 的构建与发版由 release.yml 负责，这里只做 PR 检查
  pull_request:
    paths:
      - 'app/**'
      - 'flutter/**'
      - 'tools/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
        shell: bash

      # v6 moves caching into a proprietary component; v5 is Node 24 and still MIT.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore proot runtime
        uses: actions/cache@v6
        with:
          path: |
            .cache/proot
            app/src/main/jniLibs
          key: proot-${{ runner.os }}-${{ hashFiles('tools/fetch-proot.py') }}

      - name: Fetch proot runtime
        run: python3 tools/fetch-proot.py --all

      - name: Check release notes script
        run: bash -n .github/scripts/release-notes.sh

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: claudroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # The Flutter frontend is opt-in (-PflutterUi=true) and not shipped yet. This job
  # only proves the add-to-app module still compiles; it is deliberately not a
  # dependency of `test`, so a Flutter breakage never blocks the Compose build.
  flutter-module:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
        shell: bash

      # Pinned to an exact stable release: flutter/pubspec.yaml requires >=3.47.0,
      # and moving the SDK can change the generated module project.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # v6 moves caching into a proprietary component; v5 is Node 24 and still MIT.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # settings.gradle.kts reads flutter.sdk from local.properties (or FLUTTER_ROOT).
      # local.properties is gitignored, so it is written here rather than committed.
      - name: Point Gradle at the Flutter SDK
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")}"
          test -d "$flutter_root/bin"
          echo "flutter.sdk=$flutter_root" >> local.properties
          cat local.properties

      # Generates flutter/.android/Flutter, which settings.gradle.kts checks for.
      - name: Generate Flutter module project
        working-directory: flutter
        run: flutter pub get

      # -Pandroid.newDsl=false is required: Flutter's plugin resolves AGP's legacy
      # BaseExtension, which AGP 9's new DSL no longer registers. It cannot be set
      # from settings.gradle.kts, so it stays on the command line.
      - name: Assemble debug APK with the Flutter module
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PskipProot -PflutterUi=true -Pandroid.newDsl=false
